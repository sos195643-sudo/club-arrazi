<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نادي الرازي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4EF;--surf:#fff;--ink:#10261A;--mut:#53695A;--line:#C7D9CC;--acc:#0F7A41;--accT:#fff;--red:#D8232A;--err:#B3261E;--glow:rgba(15,122,65,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07150E;--surf:#0F2A1B;--ink:#E8F3EC;--mut:#9DBBA8;--line:#24523A;--acc:#3CC27A;--accT:#07150E;--err:#FF8A80;--glow:rgba(60,194,122,.14)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07150E;--surf:#0F2A1B;--ink:#E8F3EC;--mut:#9DBBA8;--line:#24523A;--acc:#3CC27A;--accT:#07150E;--err:#FF8A80;--glow:rgba(60,194,122,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh;
background-image:radial-gradient(circle at 12% 8%,var(--glow),transparent 40%),radial-gradient(circle at 92% 92%,var(--glow),transparent 45%)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 48px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 24px}
.brand{font-family:"Reem Kufi",Cairo,sans-serif;font-size:22px;font-weight:700;line-height:1.2}
.brand small{display:block;font-family:Cairo,sans-serif;font-size:13px;color:var(--mut);font-weight:400;direction:ltr;text-align:start}
.tools{margin-inline-start:auto;display:flex;gap:8px}
.tbtn{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font:700 15px Cairo,sans-serif;cursor:pointer;padding:0 12px}
.tbtn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.spin{perspective:700px;display:inline-block}
.spin span{display:block;background:#fff;border-radius:50%;padding:8%;animation:turn 7s linear infinite;box-shadow:0 10px 30px -12px rgba(0,0,0,.45);border:3px solid var(--acc)}
.spin img{display:block;width:100%;height:auto}
.s1{width:58px}.s2{width:min(210px,52vw)}
@keyframes turn{to{transform:rotateY(360deg)}}
main{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:start}
.hero{display:flex;flex-direction:column;align-items:flex-start}
h1{font-family:"Reem Kufi",Cairo,sans-serif;font-size:clamp(34px,5.6vw,58px);line-height:1.2;margin:20px 0 14px;font-weight:700}
.lead{font-size:18px;color:var(--mut);max-width:46ch;margin:0 0 26px}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.b{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.b:nth-child(2){border-radius:18px 18px 4px 18px}.b:nth-child(3){border-radius:18px 4px 18px 18px}
.b span{font-size:26px}.b strong{display:block;font-size:16px;direction:ltr;text-align:start}.b p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.5}
.card{background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 20px 50px -24px rgba(0,0,0,.35);border-top:5px solid var(--red)}
.card h2{font-family:"Reem Kufi",Cairo,sans-serif;margin:0 0 4px;font-size:26px}
.card>form>p{margin:0 0 20px;color:var(--mut);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{margin-bottom:16px}
label,.lab{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
input[type=text],input[type=tel],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
input:focus,select:focus{outline:3px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.chip{display:inline-block;background:var(--acc);color:var(--accT);border-radius:99px;padding:2px 14px;font-weight:700;font-size:14px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;margin:0}.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.opt div{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;text-align:center;font-weight:600;font-size:14.5px;transition:.15s;direction:ltr}
.opt div em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--mut)}
.opt input:focus-visible+div{outline:3px solid var(--acc);outline-offset:1px}
.opt input:checked+div{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.opt input:checked+div em{color:var(--accT)}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:4px}
.go{width:100%;border:0;border-radius:14px;background:var(--acc);color:var(--accT);font:700 18px Cairo,sans-serif;padding:14px;cursor:pointer;min-height:54px}
.go:hover{filter:brightness(1.08)}.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}.go:disabled{opacity:.7;cursor:wait}
.note{font-size:12.5px;color:var(--mut);margin:12px 0 0;text-align:center}
.ok{display:none;text-align:center;padding:24px 4px}.ok .big{font-size:56px}.ok h2{margin:8px 0}
.ok button{margin:14px 4px 0;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 18px;font:600 15px Cairo,sans-serif;cursor:pointer}
.done form{display:none}.done .ok{display:block;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ok,.spin span{animation:none!important}}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:40px}
@media (max-width:860px){main{grid-template-columns:1fr;gap:28px}.hero{align-items:center;text-align:center}.lead{margin-inline:auto}}
@media (max-width:480px){.row,.opts{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>

$("theme").onclick=function(){
  var d=document.documentElement,cur=d.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  d.setAttribute("data-theme",cur==="dark"?"light":"dark");
};
function setErr(k,bad){$("e-"+k).textContent=bad?t("e_"+k):"";return !bad}
$("form").addEventListener("submit",function(ev){
  ev.preventDefault();
  var fn=$("fn").value.trim(),ln=$("ln").value.trim(),yv=$("yr").value,ph=$("ph").value.replace(/[\s.\-]/g,"");
  var b=document.querySelector('input[name="br"]:checked');
  var ok=true;
  ok=setErr("fn",!fn)&&ok;ok=setErr("ln",!ln)&&ok;ok=setErr("yr",!yv)&&ok;
  ok=setErr("ph",!/^(\+?213|0)?[5-7]\d{8}$/.test(ph))&&ok;ok=setErr("br",!b)&&ok;
  if(!ok)return;
  var y=YEARS.filter(function(x){return x[0]===yv})[0],yr=y[1]+" / "+y[2];
  var subject="طلب انخراط جديد - نادي الرازي ("+b.value+")";
  var body="طلب انخراط جديد في نادي الرازي\n\nالاسم / Prénom: "+fn+"\nاللقب / Nom: "+ln+"\nالمستوى الدراسي: جامعي / Universitaire\nالسنة: "+yr+"\nرقم الهاتف: "+ph+"\nالفرع: "+b.value;
  last="mailto:"+TO+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  var btn=$("go");btn.disabled=true;btn.textContent=t("sending");
  fetch("https://formsubmit.co/ajax/"+TO,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify({_subject:subject,message:body,"الاسم":fn,"اللقب":ln,"المستوى":"جامعي / Universitaire","السنة":yr,"الهاتف":ph,"الفرع":b.value,_template:"table",_captcha:"false"})})
  .then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(){sentKey="ok_sent";$("retry").style.display="none"})
  .catch(function(){sentKey="ok_fail";$("retry").style.display=""})
  .finally(function(){btn.disabled=false;btn.textContent=t("go");$("sent").textContent=t(sentKey);$("card").classList.add("done")});
});
$("retry").onclick=function(){if(last)location.href=last};
$("again").onclick=function(){$("form").reset();$("card").classList.remove("done")};
var sv="ar";try{sv=localStorage.getItem("lang")||"ar"}catch(e){}
setLang(sv==="fr"?"fr":"ar");
</script>
</body>
</html>
